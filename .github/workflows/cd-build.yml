name: CD Build

on:
  push:
    branches:
      - develop

jobs:
  build-develop:
    name: build-develop
    runs-on: macos-latest

    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project Swaply.xcodeproj -scheme Swaply

      - name: Run Fastlane build_for_develop
        run: bundle exec fastlane build_for_develop

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: swaply-build
          path: build
          