name: Fastlane

on:
  pull_request:
    branches:
      - develop
    paths:
      - 'Swaply/**'
      - 'Swaply.xcodeproj/**'
      - 'fastlane/**'
      - 'Gemfile'
      - 'Gemfile.lock'
      - 'Dangerfile'
      - '.github/workflows/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-for-pr:
    name: build-for-pr
    runs-on: macos-latest

    permissions:
      contents: read
      pull-requests: write

    env:
      FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: 120
      FASTLANE_XCODEBUILD_SETTINGS_RETRIES: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift Package Dependencies
        run: xcodebuild -resolvePackageDependencies -project Swaply.xcodeproj -scheme Swaply

      - name: Run Fastlane build_for_pr
        run: bundle exec fastlane build_for_pr

      - name: Run Danger
        run: bundle exec danger
        env:
          DANGER_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
